# -----------------------------------------------
# Ronlab Game Assistant - General Configuration
# -----------------------------------------------

# -----------------------------------------------
# Ephemeral World Copy & Dynamic Sessions:
# Temporary minigame sessions create isolated world folders on disk named
# 'sessions/session_<minigame>_<timestamp>_<uuid>'. Source template worlds
# are copied asynchronously from top-level server template directories.
#
# Deterministic Spawn Injection:
# To prevent main-thread server watchdog hangs (15-second heightmap scans),
# WorldCopyManager injects saved template spawn vectors via applyDeterministicSpawn()
# or falls back gracefully to (0.5, 100.0, 0.5) immediately after world creation/copying.
#
# Write-Ahead Logging (WAL) & State Snapshotting:
# Non-blocking WAL state transitions flush to 'sessions/<session_id>.wal'.
# An auditor task audits, flushes, and cleans active session state every 30 seconds (600 ticks).
# -----------------------------------------------

# The name of the hub world. Players receive the
# navigator compass when entering this world.
hub-world: "hub"

minigames:
  countdown:
    enabled: true
    duration-seconds: 3
    title-color: "<gold>"
    sound-enabled: true
  grace-period:
    enabled: true
    duration-seconds: 60
    allow-in-game: true

# Standardized default settings applied automatically to cloned template worlds
default-template:
  difficulty: PEACEFUL
  weather-lock: true
  time-lock: 6000
  gamerules:
    doMobSpawning: "false"
    doDaylightCycle: "false"
    doWeatherCycle: "false"
    keepInventory: "true"



# The SMP worlds. Last locations are tracked and
# restored for any world listed here.
smp-worlds:
  - "world"
  - "world_nether"
  - "world_the_end"

# Console command allowlist for lifecycle hooks and menu actions.
# Leave empty to allow all console commands, or define specific prefixes like
# "say" or "whitelist add" to restrict them.
console-command-allowlist: []

# Strict world name validation for command entry points.
# Defaults to false in v1.11.x to allow legacy world name support with warnings.
strict-world-name-validation: false


# Compass item settings
compass:
  give-on-join: true
  material: COMPASS
  name: "&6World Navigator"
  lore:
    - "&7Right-click to open the"
    - "&7World Navigator menu."
  slot: 8
  remove-on-leave-hub: true

# Social item settings
# The item is always a player head — material is fixed.
# slot should differ from compass.slot.
social-item:
  give-on-join: true
  name: "&bSocial"
  lore:
    - "&7Right-click to browse open parties"
    - "&7or return to your current party."
  slot: 7

# Hub entry behaviour
# clear-inventory-on-entry: if true (default), the player's inventory is cleared
#   when they enter the hub world (on join or teleport).
# restore-inventory-on-return: if true, inventory cleared upon entering the hub
#   will be saved and restored when the player leaves the hub, ONLY IF returning
#   to the same world group they arrived from.
hub-entry:
  clear-inventory-on-entry: true
  restore-inventory-on-return: false

# -----------------------------------------------
# Inventory Groups
# -----------------------------------------------
# Worlds in the same group share an inventory.
# Worlds not listed here get their own isolated
# inventory automatically.
# Do not add the Hub world to any group.
# -----------------------------------------------
inventory-groups:
  smp:
    worlds:
      - "world"
      - "world_nether"
      - "world_the_end"
  creative:
    worlds:
      - "Creative"
  adventure:
    worlds:
      - "Adventure"
  parkour:
    worlds:
      - "ParkourMap1"
      - "ParkourMap2"
      - "ParkourMap3"

# Messages sent to players (supports & color codes)
messages:
  no-smp-location: "&cYou have no saved SMP location yet. Visit the SMP first!"
  teleporting: "&aTeleporting..."
  world-not-found: "&cWorld '{world}' could not be found."
  reloaded: "&a[RGA] Configuration reloaded. Active game sessions will retain their launch configuration."
  no-permission: "&cYou do not have permission to do that."

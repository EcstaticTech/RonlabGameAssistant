# -----------------------------------------------
# Ronlab Game Assistant - Minigame Configuration
# -----------------------------------------------
minigames:

  bingo:
    name: "Bingo"
    display-item: FILLED_MAP
    display-lore:
      - "&7Gather items to complete"
      - "&7your bingo board first!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: bingo gui"
    conclude-commands:
      - "leader: bingo stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY

  ultimate_tag:
    name: "Ultimate Tag"
    display-item: STICK
    display-lore:
      - "&7Tag enemy players before"
      - "&7the timer expires!"
    max-players: 2
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: tag start %leader% %second%"
    conclude-commands:
      - "leader: tag stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: PEACEFUL
      gamerules:
        locator_bar: "false"

  infectedmanhunt:
    name: "Infected Manhunt"
    display-item: COMPASS
    display-lore:
      - "&7Hunters infect runners upon death."
      - "&7Can the speedrunner beat the Ender Dragon?"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: infectedmanhunt gui"
    conclude-commands:
      - "leader: infected stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY
      gamerules:
        locator_bar: "false"

  speedrunnerswap:
    name: "Speedrunner Swap"
    display-item: OBSIDIAN
    display-lore:
      - "&7Randomly swap locations"
      - "&7with other speedrunners!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: swap gui"
    conclude-commands:
      - "leader: swap stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY

  deathrace:
    name: "Death Race"
    display-item: OBSIDIAN
    display-lore:
      - "&7Race against time and deadly"
      - "&7hazards to reach the finish!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: deathrace start"
    conclude-commands:
      - "leader: deathrace stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY

  blockshuffle:
    name: "Block Shuffle"
    display-item: OBSIDIAN
    display-lore:
      - "&7Stand on your assigned block"
      - "&7before the timer runs out!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: blockshuffle"
    conclude-commands:
      - "leader: blockshuffle stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY

  hitmen:
    name: "Hitmen"
    display-item: OBSIDIAN
    display-lore:
      - "&7Eliminate your assigned target"
      - "&7before you become a victim!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: hitmen"
    conclude-commands:
      - "leader: hitmen stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY
      gamerules:
        locator_bar: "false"

  achievementrace:
    name: "Achievement Race"
    display-item: OBSIDIAN
    display-lore:
      - "&7Unlock achievements faster"
      - "&7than rival players!"
    max-players: 8
    min-players: 2
    world-type: VANILLA
    start-commands:
      - "leader: achievementrace start %second% %third% %fourth% %fifth% %sixth% %seventh% %eighth%"
    conclude-commands:
      - "leader: achievementrace stop"
    world-settings:
      gamemode: SURVIVAL
      pvp: true
      difficulty: EASY

  sumo:
    name: "Sumo"
    display-item: OBSIDIAN
    display-lore:
      - "&7Knock your opponent off the platform!"
      - "&7Last player standing wins."
    max-players: 8
    min-players: 2
    world-type: TEMPLATE
    template-world: SumoTemplate
    start-commands:
      - "leader: sumo start %leader% %second% %third% %fourth%"
    conclude-commands:
      - "leader: sumo stop"

  parkour:
    name: "Parkour"
    display-item: RABBIT_FOOT
    display-lore:
      - "&7Solo and competitive parkour courses."
    max-players: 8
    min-players: 1
    world-type: TEMPLATE
    template-world: "1000blocks"
    start-commands:
      - "leader: parkour start %leader% %template%"
    conclude-commands:
      - "leader: parkour stop"
    world-settings:
      gamemode: ADVENTURE
      pvp: false
      difficulty: PEACEFUL
      time-lock: "0"
      weather-lock: "true"
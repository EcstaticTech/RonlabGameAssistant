name: RonlabGameAssistant
version: '1.11.0'
main: com.ronlab.rga.RGA
api-version: '26.1'
description: All-in-one game assistant plugin for Ronlab server.
authors: []

commands:
  rga:
    description: Ronlab Game Assistant admin command.
    usage: /rga <reloadconfig|tp|conclude|createworld|compass>
    permission: rga.admin
  hub:
    description: Return to the Hub world.
    usage: /hub
    permission: rga.hub

permissions:
  rga.admin:
    description: Wildcard — grants all RGA admin permissions.
    default: op
    children:
      rga.reload: true
      rga.world.teleport: true
      rga.world.manage: true
      rga.world.configure: true
      rga.session.conclude: true
      rga.session.status: true
      rga.session.cleanup: true
  rga.reload:
    description: Allows reloading RGA configs and world definitions (/rga reloadconfig, /rga reload).
    default: op
  rga.world.teleport:
    description: Allows listing worlds and teleporting players (/rga listworlds, /rga tp, /rga compass).
    default: op
  rga.world.manage:
    description: Allows creating, importing, loading, unloading, and deleting worlds.
    default: op
  rga.world.configure:
    description: Allows configuring world attributes (setspawn, setworldgamemode, etc.).
    default: op
  rga.session.conclude:
    description: Allows concluding active minigame sessions (/rga conclude, /rga concludeall).
    default: op
  rga.session.status:
    description: Allows checking active session status (/rga sessions list).
    default: op
  rga.session.cleanup:
    description: Allows cleaning up orphaned session files (/rga cleanupsession).
    default: op
  rga.hub:
    description: Allows use of the /hub command.
    default: true

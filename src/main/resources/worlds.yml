# -----------------------------------------------
# Ronlab Game Assistant - World Configuration
# -----------------------------------------------
# Fields:
#   load-on-startup: true/false
#   environment: NORMAL, NETHER, THE_END
#   gamemode: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR
#   pvp: true/false
#   difficulty: PEACEFUL, EASY, NORMAL, HARD
#   alias: Display name shown in messages
#   template: true = world is a copy-only template,
#             players cannot enter directly
#   time-lock: Ticks to lock time at (0-24000),
#              or -1 for no lock. 6000 = noon.
#   weather-lock: true = always clear weather
#
#   first-visit-spawn: Optional spawn for players with no tracked location.
#     Falls back to world spawn if not set. Accepts three formats:
#       Map:    first-visit-spawn: {x: 100, y: 64, z: -200, yaw: 90, pitch: 0}
#       String: first-visit-spawn: "100, 64, -200, 90, 0"   # yaw/pitch optional
#       List:   first-visit-spawn: [100, 64, -200, 90, 0]   # yaw/pitch optional
# -----------------------------------------------

worlds:
  Hub:
    load-on-startup: true
    environment: NORMAL
    gamemode: ADVENTURE
    pvp: false
    difficulty: PEACEFUL
    announce-join: false
    alias: "Hub"
    template: false
    time-lock: 6000
    weather-lock: true

  world:
    load-on-startup: true
    environment: NORMAL
    gamemode: SURVIVAL
    pvp: true
    difficulty: NORMAL
    announce-join: false
    alias: "SMP Overworld"
    template: false
    time-lock: -1
    weather-lock: false

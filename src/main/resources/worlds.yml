# -----------------------------------------------
# Ronlab Game Assistant - World Configuration
# -----------------------------------------------
# Fields:
#   load-on-startup: true/false
#   environment: NORMAL, NETHER, THE_END
#   gamemode: SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR
#   pvp: true/false
#   difficulty: PEACEFUL, EASY, NORMAL, HARD
#   alias: Display name shown in messages
#   template: true = world is a copy-only template,
#             players cannot enter directly
#   time-lock: Ticks to lock time at (0-24000),
#              or -1 for no lock. 6000 = noon.
#   weather-lock: true = always clear weather
# -----------------------------------------------

worlds:
  Hub:
    load-on-startup: true
    environment: NORMAL
    gamemode: ADVENTURE
    pvp: false
    difficulty: PEACEFUL
    announce-join: false
    alias: "Hub"
    template: false
    time-lock: 6000
    weather-lock: true

  world:

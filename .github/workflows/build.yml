name: Build RonlabGameAssistant

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: List jar contents
        run: jar tf target/RonlabGameAssistant-1.0.0.jar

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: target/RonlabGameAssistant-1.0.0.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: RonlabGameAssistant
          path: target/RonlabGameAssistant-1.0.0.jar

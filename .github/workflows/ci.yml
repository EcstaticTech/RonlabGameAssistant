name: RGA CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*", "develop/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests
        run: mvn clean test --no-transfer-progress

      - name: Package Plugin & API
        run: mvn package -DskipTests --no-transfer-progress

      - name: Verify Build Artifacts
        run: |
          ls -la rga-api/target/*.jar
          ls -la rga-plugin/target/*.jar

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RonlabGameAssistant-Plugin
          path: rga-plugin/target/RonlabGameAssistant-*.jar

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RonlabGameAssistant-API
          path: rga-api/target/rga-api-*.jar
